# Producao: PostgreSQL. Todos os segredos via variaveis de ambiente (sem
# default -> fail-fast no boot quando ausentes).
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flashcards}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  h2:
    console:
      enabled: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000
    refresh-expiration: 604800000
  user:
    email: ${APP_USER_EMAIL}
    password: ${APP_USER_PASSWORD}
  frontend:
    url: ${FRONTEND_URL}
  openrouter:
    url: ${OPENROUTER_URL:https://openrouter.ai/api/v1}
    api-key: ${OPENROUTER_API_KEY}
    reader-model: ${OPENROUTER_READER_MODEL:google/gemini-2.5-flash}
    generator-model: ${OPENROUTER_GENERATOR_MODEL:deepseek/deepseek-v4.1-flash}
    base-prompt: ${APP_OPENROUTER_BASE_PROMPT:}
    referer: ${OPENROUTER_REFERER:}
    title: ${OPENROUTER_TITLE:Flashcards}
  s3:
    # Aceita os nomes S3_* (os mesmos do dev/base) e, por compatibilidade,
    # APP_S3_*. Sem S3_ENDPOINT/credenciais o boot falha com mensagem clara
    # (ver S3Config), em vez de passar o placeholder literal para URI.create.
    endpoint: ${S3_ENDPOINT:${APP_S3_ENDPOINT:}}
    access-key: ${S3_ACCESS_KEY:${APP_S3_ACCESS_KEY:}}
    secret-key: ${S3_SECRET_KEY:${APP_S3_SECRET_KEY:}}
    bucket: ${S3_BUCKET_NAME:${APP_S3_BUCKET:flashcards}}
    region: ${S3_REGION:${APP_S3_REGION:us-east-1}}
