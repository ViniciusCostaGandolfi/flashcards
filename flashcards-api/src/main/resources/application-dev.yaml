# Perfil "dev" -- ambiente de desenvolvimento local via Docker Compose.
# Aponta para PostgreSQL e MinIO do docker-compose. O OpenRouter so e usado de
# verdade se OPENROUTER_API_KEY estiver definida; caso contrario, usa o mock.
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flashcards}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:flashcards}
    password: ${DB_PASSWORD:flashcards}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate

  h2:
    console:
      enabled: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:flashcards-dev-secret-change-me-0123456789}
    expiration: 86400000
    refresh-expiration: 604800000
  user:
    email: ${APP_USER_EMAIL:vinicius@vgandolfi.dev}
    password: ${APP_USER_PASSWORD:admin123}
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  openrouter:
    url: ${OPENROUTER_URL:https://openrouter.ai/api/v1}
    api-key: ${OPENROUTER_API_KEY:}
    reader-model: ${OPENROUTER_READER_MODEL:google/gemini-2.5-flash}
    generator-model: ${OPENROUTER_GENERATOR_MODEL:deepseek/deepseek-v4.1-flash}
    referer: ${OPENROUTER_REFERER:http://localhost:3000}
    title: ${OPENROUTER_TITLE:Flashcards}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET_NAME:flashcards}
    region: ${S3_REGION:us-east-1}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui/index.html
